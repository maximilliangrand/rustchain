[package]
name = "rustchain"
version = "0.1.0"
edition = "2021"
authors = ["Maxim Gagiev <maximgagiev@myg-media.com>"]
description = "A blockchain implementation from scratch in Rust - educational & portfolio project"
repository = "https://github.com/maximilliangrand/rustchain"
license = "MIT"
keywords = ["blockchain", "cryptocurrency", "rust", "distributed-systems"]

[dependencies]
# Cryptography
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Networking
tokio = { version = "1.35", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Unique IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "rustchain"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
