[package]
name = "rustchain-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
tokio = { version = "1.35", features = ["io-util", "rt"] }

[dependencies.rustchain]
path = ".."

# The fuzz crate is its own workspace: it is only ever built by cargo-fuzz with
# nightly and a sanitizer, and it must not drag libFuzzer into a plain
# `cargo build` of the library.
[workspace]
members = ["."]

[profile.release]
debug = true

[[bin]]
name = "transaction_deserialize"
path = "fuzz_targets/transaction_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_deserialize"
path = "fuzz_targets/block_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_decode"
path = "fuzz_targets/message_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_frame"
path = "fuzz_targets/message_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chain_import"
path = "fuzz_targets/chain_import.rs"
test = false
doc = false
bench = false
